# Builds the Windows installer from this repository's source, so a release can attach a
# CI-built installer.
name: build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check
        run: npm run verify

      - name: Build installer
        run: npx vite build; if ($?) { npx electron-builder --win nsis --publish never }

      - uses: actions/upload-artifact@v4
        with:
          name: ctrl-installer
          path: release/ctrl-Setup-*.exe
          if-no-files-found: error
